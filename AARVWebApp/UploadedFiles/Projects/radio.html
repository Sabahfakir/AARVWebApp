
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Work and Education Info</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Bootstrap 5 CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .editor-toolbar {
      border: 1px solid #ccc;
      padding: 0.4rem;
      border-bottom: none;
      background-color: #f9f9f9;
    }

    .editor-content {
      border: 1px solid #ccc;
      min-height: 150px;
      padding: 0.5rem;
    }

    .radio-label {
      margin-right: 15px;
    }

    .work-textarea {
      display: none;
    }
  </style>
</head>
<body class="p-4">

  <!-- Work Experience Information -->
  <h5>Work Experience Information</h5>

  <div class="mb-3">
    <label class="radio-label">
      <input type="radio" name="workStatus" value="fresher" checked onclick="toggleExperience()"> <span class="text-danger fw-bold">Fresher</span>
    </label>
    <label class="radio-label">
      <input type="radio" name="workStatus" value="experience" onclick="toggleExperience()"> <span class="text-secondary fw-bold">Experience</span>
    </label>
  </div>

  <div id="experienceTextarea" class="mb-4 work-textarea">
    <label for="experienceDetails" class="form-label">Work Experience Details</label>
    <textarea class="form-control" id="experienceDetails" rows="4" placeholder="Describe your work experience..."></textarea>
  </div>

  <!-- Education Information -->
  <h5>Education Information</h5>
  <div class="mb-2">
    <label class="form-label">Education Details</label>
    <div class="editor-toolbar">
      <button onclick="format('bold')" class="btn btn-sm btn-light"><b>B</b></button>
      <button onclick="format('italic')" class="btn btn-sm btn-light"><i>I</i></button>
      <button onclick="format('underline')" class="btn btn-sm btn-light"><u>U</u></button>
      <button onclick="format('insertUnorderedList')" class="btn btn-sm btn-light">• List</button>
      <button onclick="format('insertOrderedList')" class="btn btn-sm btn-light">1. List</button>
    </div>
    <div id="educationEditor" class="editor-content" contenteditable="true">
      Education Details
    </div>
  </div>

  <script>
    function toggleExperience() {
      const experienceDiv = document.getElementById("experienceTextarea");
      const experienceRadio = document.querySelector('input[value="experience"]');
      experienceDiv.style.display = experienceRadio.checked ? "block" : "none";
    }

    function format(command) {
      document.execCommand(command, false, null);
    }
  </script>

</body>
</html>
